<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Đăng nhập</title>
  <meta name="author" content="Vu Duy Linh">
  <link rel="icon" type="image/png" href="/image/shopping-cart.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="wrapper">
  <header class="page-header">
    <a class="logo" href="/home.html"><img src="/image/vnsoftware.png" alt="logo"></a>
    <h1>Đăng nhập</h1>
    <nav class="mini-nav">
      <div class="shopping-cart">
        <p class="no-ordered-items">0</p>
        <i class="icon-cart fa fa-shopping-cart"></i>
      </div>
      <div id="authentication">
        <a href="/page/register.html">Đăng ký</a>
        <a href="/page/login.html">Đăng nhập</a>
      </div>
      <div id="user-info" class="hidden">
        <span id="principal"></span>
        <a href="#" id="logout">Đăng xuất</a>
      </div>
    </nav>
  </header>

  <main class="page-main-2dot1">
    <div class="container">
      <h2>Đăng nhập tài khoản</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required>
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
        </div>
        <div class="form-group">
          <button type="submit">Đăng nhập</button>
        </div>
        <p id="login-message"></p>
        <p>Chưa có tài khoản? <a href="/page/register.html">Đăng ký ngay</a></p>
      </form>
    </div>
  </main>

  <footer class="page-footer"> &copy; vdlinh@ctu.edu.vn, 2021</footer>

  <script src="/js/authentication.js"></script>
  <script>
    checkAuthentication();

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const msg      = document.getElementById('login-message');

      const stored = localStorage.getItem('user_' + username);
      if (!stored) {
        msg.style.color = 'red';
        msg.textContent = 'Tên đăng nhập không tồn tại!';
        return;
      }

      const user = JSON.parse(stored);
      if (user.password !== password) {
        msg.style.color = 'red';
        msg.textContent = 'Mật khẩu không đúng!';
        return;
      }

      // Lưu phiên đăng nhập
      sessionStorage.setItem('loggedInUser', JSON.stringify({ username: user.username, fullname: user.fullname }));
      msg.style.color = 'green';
      msg.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';
      setTimeout(() => window.location.href = '/home.html', 1200);
    });
  </script>
</body>

</html>
